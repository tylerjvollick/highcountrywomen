<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>High Country Women — Custom Theme</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body class="scheme-cream">
<div id="root"></div>

<template id="__bundler_thumbnail">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="#F5EFE5"/>
  <g fill="#D33F2B">
    <path d="M50 20 L58 38 L76 30 L68 48 L86 50 L68 52 L76 70 L58 62 L50 80 L42 62 L24 70 L32 52 L14 50 L32 48 L24 30 L42 38 Z"/>
    <rect x="40" y="40" width="20" height="20" fill="#F5EFE5"/>
    <rect x="44" y="44" width="12" height="12" fill="#D33F2B"/>
  </g>
</svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="image-slot.js"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="jsx/ui.jsx"></script>
<script type="text/babel" src="jsx/products.jsx"></script>
<script type="text/babel" src="jsx/pages.jsx"></script>
<script type="text/babel" src="jsx/collection.jsx"></script>
<script type="text/babel" src="jsx/product-page.jsx"></script>
<script type="text/babel" src="jsx/timeline.jsx"></script>
<script type="text/babel" src="jsx/about-workshops.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

/* ---- Cart drawer --------------------------------------------------------- */
function CartDrawer({ open, items, onClose, onRemove }) {
  const total = items.reduce((s, i) => s + i.price * i.qty, 0);
  return (
    <React.Fragment>
      <div onClick={onClose} style={{ position: 'fixed', inset: 0, zIndex: 95, background: 'rgba(46,42,36,.36)',
        opacity: open ? 1 : 0, pointerEvents: open ? 'auto' : 'none', transition: 'opacity .3s var(--ease)' }} />
      <aside className="scheme-cream tidy-scroll" style={{ position: 'fixed', top: 0, right: 0, bottom: 0, zIndex: 100,
        width: 'min(440px, 94vw)', background: 'var(--bg)', boxShadow: 'var(--shadow-lg)',
        transform: open ? 'translateX(0)' : 'translateX(100%)', transition: 'transform .34s var(--ease)',
        display: 'flex', flexDirection: 'column', overflowY: 'auto' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '24px 26px', borderBottom: '1px solid var(--line)' }}>
          <span style={{ fontFamily: 'var(--font-display)', fontSize: '24px' }}>Your Cart</span>
          <span onClick={onClose} style={{ cursor: 'pointer' }}><Icon name="x" size={22} /></span>
        </div>
        <div style={{ flex: 1, padding: '8px 26px' }}>
          {items.length === 0 && <div style={{ textAlign: 'center', padding: '72px 0', fontFamily: 'var(--font-serif)', fontStyle: 'italic', color: 'var(--text-mute)' }}>Your cart is empty.</div>}
          {items.map(it => (
            <div key={it.id} style={{ display: 'flex', gap: '16px', padding: '20px 0', borderBottom: '1px solid var(--line)' }}>
              <div style={{ width: '68px', flex: 'none' }}><ProductCover product={it} ratio="1/1" /></div>
              <div style={{ flex: 1, fontFamily: 'var(--font-sans)' }}>
                <div style={{ fontFamily: 'var(--font-display)', fontSize: '17px' }}>{it.name}</div>
                <div style={{ fontSize: '12.5px', color: 'var(--text-mute)', margin: '3px 0 8px' }}>{it.level || 'PDF Pattern'} · Qty {it.qty}</div>
                <div style={{ fontSize: '14px' }}>${(it.price * it.qty).toFixed(2)} USD</div>
              </div>
              <span onClick={() => onRemove(it.id)} style={{ cursor: 'pointer', color: 'var(--text-mute)', height: 'fit-content' }}><Icon name="trash-2" size={16} /></span>
            </div>
          ))}
        </div>
        {items.length > 0 && (
          <div style={{ padding: '22px 26px', borderTop: '1px solid var(--line)' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontFamily: 'var(--font-sans)', fontSize: '15px', fontWeight: 600, marginBottom: '8px' }}>
              <span>Subtotal</span><span>${total.toFixed(2)} USD</span></div>
            <p style={{ fontFamily: 'var(--font-serif)', fontStyle: 'italic', fontSize: '13px', color: 'var(--text-mute)', margin: '0 0 16px' }}>Shipping &amp; taxes calculated at checkout.</p>
            <Button variant="ink" full>Check out</Button>
          </div>
        )}
      </aside>
    </React.Fragment>
  );
}

function Toast({ msg }) {
  if (!msg) return null;
  return <div style={{ position: 'fixed', bottom: '28px', left: '50%', transform: 'translateX(-50%)', zIndex: 130,
    background: 'var(--hcw-ink)', color: 'var(--hcw-cream)', fontFamily: 'var(--font-sans)', fontSize: '14px',
    padding: '14px 24px', borderRadius: 'var(--radius-md)', boxShadow: 'var(--shadow-lg)', display: 'flex', alignItems: 'center', gap: '10px' }}>
    <Icon name="check" size={16} style={{ color: 'var(--hcw-red-bright)' }} />{msg}</div>;
}

/* ---- Tweak defaults ------------------------------------------------------ */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "hero": "card",
  "cardStyle": "minimal",
  "motion": true
}/*EDITMODE-END*/;

/* ---- App ----------------------------------------------------------------- */
function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [page, setPage] = useState('home');
  const [active, setActive] = useState(null);
  const [cart, setCart] = useState([]);
  const [cartOpen, setCartOpen] = useState(false);
  const [toast, setToast] = useState('');

  useEffect(() => { window.scrollTo(0, 0); }, [page, active]);
  // toggle motion globally
  useEffect(() => {
    document.documentElement.style.setProperty('--reveal-disabled', t.motion ? '0' : '1');
    if (!t.motion) document.querySelectorAll('.reveal').forEach(e => e.classList.add('in'));
  }, [t.motion, page, active]);

  const nav = (p) => { setPage(p); if (p !== 'product') setActive(null); };
  const open = (product) => { setActive(product); setPage('product'); };
  const add = (product) => {
    setCart(c => {
      const found = c.find(i => i.id === product.id);
      if (found) return c.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i);
      return [...c, { ...product, qty: 1 }];
    });
    setToast('Added “' + product.name + '” to cart');
    setTimeout(() => setToast(''), 1900);
  };
  const remove = (id) => setCart(c => c.filter(i => i.id !== id));
  const count = cart.reduce((s, i) => s + i.qty, 0);

  return (
    <div className={t.motion ? '' : 'no-motion'}>
      <Header onNav={nav} current={page} cartCount={count} onCart={() => setCartOpen(true)} />
      {page === 'home' && <HomePage onNav={nav} onOpen={open} onAdd={add} heroVariant={t.hero} cardStyle={t.cardStyle} />}
      {page === 'collection' && <CollectionPage onOpen={open} onAdd={add} cardStyle={t.cardStyle} />}
      {page === 'fabric' && <FabricPage onAdd={add} />}
      {page === 'product' && active && <ProductPage product={active} onAdd={add} onOpen={open} onNav={nav} />}
      {page === 'about' && <AboutPage onNav={nav} />}
      {page === 'workshops' && <WorkshopsPage onNav={nav} />}
      <Footer onNav={nav} />
      <CartDrawer open={cartOpen} items={cart} onClose={() => setCartOpen(false)} onRemove={remove} />
      <Toast msg={toast} />

      <TweaksPanel>
        <TweakSection label="Homepage hero" />
        <TweakRadio label="Layout" value={t.hero} options={['overlay-left', 'card', 'split', 'overlay']} onChange={v => setTweak('hero', v)} />
        <TweakSection label="Product cards" />
        <TweakRadio label="Style" value={t.cardStyle} options={['minimal', 'button']} onChange={v => setTweak('cardStyle', v)} />
        <TweakSection label="Details" />
        <TweakToggle label="Scroll animations" value={t.motion} onChange={v => setTweak('motion', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
